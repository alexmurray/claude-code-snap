name: claude-code
base: core26
version: "2.1.295"
title: Claude Code
summary: Agentic coding tool that lives in your terminal
description: |
  Claude Code is Anthropic's agentic coding tool. It lives in your terminal,
  understands your codebase, and helps you code faster through natural
  language commands — delegating engineering tasks directly from the
  terminal, keeping developers in control of the entire process.

  Claude Code requires an Anthropic account (a Claude subscription, or API
  billing) to use. Use is subject to Anthropic's terms; see
  https://code.claude.com/docs/en/overview.

  This snap bundles Anthropic's official prebuilt `claude` binary, fetched
  directly from anthropics/claude-code's GitHub release assets. Claude
  Code's implementation is closed source, so unlike a typical snap this
  package cannot build it from source: it fetches the published release
  binary directly and wraps it for classic confinement.

  The optional `desktop` component adds Claude Desktop (beta), Anthropic's
  desktop app with Chat, Cowork and Claude Code tabs, from Anthropic's
  official .deb package. Install it with `snap install claude-code+desktop`
  and launch "Claude" from your application launcher. Like the upstream
  package, it targets Debian-based desktops (Ubuntu 22.04+, Debian 12+) and
  uses the host's GTK, NSS and related desktop libraries.

  The snap packaging is maintained separately at
  https://github.com/alexmurray/claude-snap
contact: https://github.com/alexmurray/claude-snap/issues
website: https://code.claude.com/docs/en/overview
source-code: https://github.com/anthropics/claude-code
issues: https://github.com/alexmurray/claude-snap/issues
assumes: [snapd2.76]

grade: stable
confinement: classic

components:
  desktop:
    type: standard
    summary: Claude Desktop (beta)
    description: |
      Claude Desktop, Anthropic's desktop app for Chat, Cowork and Claude
      Code, from Anthropic's official .deb package. Run it with
      `claude-code.desktop` or launch "Claude" from your application
      launcher.
    # Claude Desktop is versioned independently of the CLI (e.g. 2.31226.1
    # vs 2.1.295), so the component gets its own version, read from the
    # .deb's control file by the claude-desktop part.
    adopt-info: claude-desktop

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

apps:
  claude-code:
    command: bin/claude.wrapper
    completer: usr/share/bash-completion/completions/claude-code.completion
    environment:
      DISABLE_AUTOUPDATER: "1"
  claude:
    command: bin/claude.wrapper
    completer: usr/share/bash-completion/completions/claude.completion
    environment:
      DISABLE_AUTOUPDATER: "1"
  # No `desktop:` key: the claude-desktop part installs upstream's desktop
  # entry straight into meta/gui instead — see there for why.
  desktop:
    command: bin/claude-desktop.wrapper

parts:
  # ============================================================
  # claude-code-binary — fetch Anthropic's prebuilt per-arch native
  # binary from anthropics/claude-code's GitHub release assets
  # (claude-linux-<arch>.tar.gz). Claude Code is closed source: the
  # published release binary *is* the upstream artifact, nothing to
  # build. That repo holds no source, but does publish real tagged
  # releases with these binaries attached, plus a PGP-signed
  # SHASUMS256.txt — see AGENTS.md for why GitHub was chosen over
  # npm/downloads.claude.ai (both also work; this one has no regional
  # restriction and the strongest provenance).
  #
  # The version lives only in the top-level `version:` field; both
  # source URLs below interpolate it via $CRAFT_PROJECT_VERSION, so
  # Renovate only has to touch one field. No `adopt-info:`/
  # `craftctl set version=`: nothing here is derived at build time.
  # ============================================================
  claude-code-binary:
    plugin: dump
    source:
      - on amd64 to amd64: https://github.com/anthropics/claude-code/releases/download/v$CRAFT_PROJECT_VERSION/claude-linux-x64.tar.gz
      - on arm64 to arm64: https://github.com/anthropics/claude-code/releases/download/v$CRAFT_PROJECT_VERSION/claude-linux-arm64.tar.gz
    organize:
      claude: bin/claude
    override-build: |
      set -ex
      craftctl default

      # Verify sha256 against a pinned known-good value, taken from the
      # release's own PGP-signed SHASUMS256.txt (signature not verified
      # at build time — see AGENTS.md). `source-checksum` can't do this:
      # craft-parts rejects its per-architecture "on <arch> to <arch>"
      # grammar, and each arch needs a different checksum — see AGENTS.md
      # for why splitting into two parts doesn't avoid this either.
      #
      # Recompute after bumping the version:
      #   curl -fsSL https://github.com/anthropics/claude-code/releases/download/<version>/SHASUMS256.txt
      #   curl -fsSL <url> | tar -xzO claude | sha256sum
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64)
          EXPECTED_SHA256=4503bfe11a6c7fcc1e0b39b5e0d347c04248f750b03b0977b3ad6b531fe6f358
          ;;
        arm64)
          EXPECTED_SHA256=cfb9dc1332fb6f92a683f835823e91b3179a803398ca7852cd2381a3cb1dea3b
          ;;
      esac
      ACTUAL_SHA256=$(sha256sum "${CRAFT_PART_INSTALL}/claude" | cut -d' ' -f1)
      if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
        echo "ERROR: claude binary checksum mismatch for $CRAFT_ARCH_BUILD_FOR" >&2
        echo "  expected: $EXPECTED_SHA256" >&2
        echo "  actual:   $ACTUAL_SHA256" >&2
        exit 1
      fi

      # The release tarball stores the executable bit on `claude` itself,
      # but reassert it as defense in depth against a registry/tar edge
      # case silently dropping it (the installed snap would otherwise fail
      # with a confusing "Permission denied").
      chmod 755 "${CRAFT_PART_INSTALL}/claude"

  # ============================================================
  # claude-desktop — Anthropic's prebuilt Electron desktop app, routed
  # into the `desktop` component. Claude Desktop is published only as a
  # .deb in Anthropic's apt repository on downloads.claude.ai (not on
  # GitHub), so this part fetches the .deb straight from that repository's
  # package pool. That host enforces Anthropic's regional
  # service-availability allowlist, so unlike claude-code-binary this part
  # can only be built from a supported country — see AGENTS.md.
  #
  # The version lives only in this source URL (Renovate's `deb` datasource
  # tracks it); $CRAFT_ARCH_BUILD_FOR expands to amd64/arm64, which are
  # also the Debian architecture names the repository uses. The
  # component's version is read back out of the .deb itself below, so it
  # can't drift from the URL.
  # ============================================================
  claude-desktop:
    plugin: nil
    source: https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_3.1623.0_$CRAFT_ARCH_BUILD_FOR.deb
    source-type: file
    organize:
      claude-desktop/: (component/desktop)/
    override-build: |
      set -ex
      DEB=$(ls "$CRAFT_PART_SRC"/claude-desktop_*.deb)

      # Verify the .deb's sha256 against a pinned known-good value, taken
      # from the SHA256 field of the repository's Packages index (itself
      # covered by the repository's PGP-signed InRelease; signature not
      # verified at build time, same as claude-code-binary). Pinned per
      # arch here for the same reason as claude-code-binary — see
      # AGENTS.md. scripts/update-checksums.py recomputes these.
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64)
          EXPECTED_DEB_SHA256=d39e1d9a570f1e517f158479f5a1d903b9a74d1ef3f279362002dcad375e33cf
          ;;
        arm64)
          EXPECTED_DEB_SHA256=a6e18ed06b48e0af2acd08f4837c2695a4cc027e31a82891a651b486a4a0e55c
          ;;
      esac
      ACTUAL_DEB_SHA256=$(sha256sum "$DEB" | cut -d' ' -f1)
      if [ "$ACTUAL_DEB_SHA256" != "$EXPECTED_DEB_SHA256" ]; then
        echo "ERROR: claude-desktop .deb checksum mismatch for $CRAFT_ARCH_BUILD_FOR" >&2
        echo "  expected: $EXPECTED_DEB_SHA256" >&2
        echo "  actual:   $ACTUAL_DEB_SHA256" >&2
        exit 1
      fi

      craftctl set components.desktop.version="$(dpkg-deb -f "$DEB" Version)"

      # Unpack only the payload: the maintainer scripts aren't run. What
      # they'd do on a host (register the apt repository, an AppArmor
      # userns profile, the GNOME search provider and MIME types, and a
      # /usr/bin/ccd link) is system-wide state a snap doesn't install —
      # see AGENTS.md for which of those matter.
      rm -rf "$CRAFT_PART_BUILD/deb"
      dpkg-deb -x "$DEB" "$CRAFT_PART_BUILD/deb"

      # The app tree goes into the component (via organize above).
      # chrome-sandbox is Chromium's setuid-root sandbox helper: a snap
      # can't ship a working setuid binary, so drop it rather than ship a
      # dead one — claude-desktop.wrapper handles the sandbox instead.
      # (rm first so a rebuild after an interrupted one doesn't copy the
      # tree into a leftover copy of itself.)
      rm -rf "$CRAFT_PART_INSTALL/claude-desktop"
      cp -a "$CRAFT_PART_BUILD/deb/usr/lib/claude-desktop" "$CRAFT_PART_INSTALL/claude-desktop"
      rm -f "$CRAFT_PART_INSTALL/claude-desktop/chrome-sandbox"
      install -Dm644 "$CRAFT_PART_BUILD/deb/usr/share/doc/claude-desktop/copyright" \
        "$CRAFT_PART_INSTALL/claude-desktop/copyright"

      # The icon and desktop entry go into the main snap (snapd only reads
      # desktop entries from there), so the launcher entry exists even
      # before the component is installed; claude-desktop.wrapper explains
      # how to install it in that case.
      install -Dm644 "$CRAFT_PART_BUILD/deb/usr/share/icons/hicolor/256x256/apps/claude-desktop.png" \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/256x256/apps/claude-desktop.png"

      # The desktop entry is upstream's own, with its launch command and
      # icon pointed at the snap, so new actions, MIME types etc. carry
      # over automatically. Installed straight into meta/gui (snapd exports
      # it as claude-code_desktop.desktop) rather than via the `desktop`
      # app's `desktop:` key: snapcraft would overwrite that entry's Icon=
      # with the snap-level icon (snap/gui/icon.png, the CLI's mascot).
      # snapd only accepts Exec= lines that run one of the snap's own apps,
      # so fail the build if upstream changes its command in a way this
      # rewrite doesn't cover, rather than ship a broken launcher.
      DESKTOP_FILE="$CRAFT_PART_INSTALL/meta/gui/desktop.desktop"
      install -Dm644 "$CRAFT_PART_BUILD/deb/usr/share/applications/com.anthropic.Claude.desktop" \
        "$DESKTOP_FILE"
      sed -i \
        -e 's|^Exec=claude-desktop$|Exec=claude-code.desktop|' \
        -e 's|^Exec=claude-desktop |Exec=claude-code.desktop |' \
        -e 's|^Icon=claude-desktop$|Icon=${SNAP}/usr/share/icons/hicolor/256x256/apps/claude-desktop.png|' \
        "$DESKTOP_FILE"
      if grep '^Exec=' "$DESKTOP_FILE" | grep -v -E '^Exec=claude-code\.desktop( |$)'; then
        echo "ERROR: unexpected Exec= line(s) in upstream's desktop entry (above)" >&2
        exit 1
      fi
      if grep '^Icon=' "$DESKTOP_FILE" | grep -v '^Icon=\${SNAP}/'; then
        echo "ERROR: unexpected Icon= line(s) in upstream's desktop entry (above)" >&2
        exit 1
      fi

  # ============================================================
  # wl-clipboard — Wayland clipboard tools from Ubuntu package.
  # Needed for clipboard support on Wayland (default display server).
  # Claude Code shells out to wl-copy/wl-paste on Wayland, falling back
  # to xclip/xsel on X11 (left to the host, not bundled here).
  # ============================================================
  wl-clipboard:
    after:
      - claude-code-binary
    plugin: nil
    stage-packages:
      - wl-clipboard
    stage:
      - usr/bin/wl-copy
      - usr/bin/wl-paste
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libwayland-client.so.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libwayland-client.so.0.*
    # Classic confinement skips snapcraft's automatic ELF interpreter/rpath
    # patching by default (it assumes a classic snap's binaries should run
    # against the host's own libraries, unpatched). wl-copy/wl-paste are the
    # exception: they need to resolve against the base snap's libwayland,
    # not the host's. enable-patchelf re-enables that automatic patching for
    # just this part's primed ELF files (prime step only — it relies on the
    # tracked file list, so it can't be combined with override-prime). It
    # inspects each binary's real DT_NEEDED dependencies and computes the
    # correct interpreter/rpath itself (bundled libs get an $ORIGIN-relative
    # rpath, base-snap libs get their real /snap/core26/current/... path),
    # rather than this part hardcoding a guess per architecture by hand.
    build-attributes:
      - enable-patchelf

  # ============================================================
  # gdbus — for claude-desktop.wrapper's Cowork notification. Talks to
  # the desktop's org.freedesktop.Notifications service directly, rather
  # than relying on the host having notify-send (libnotify-bin, optional
  # on many distros) or bundling it (libnotify4 pulls in gdk-pixbuf and its
  # host-path loader plugins). core26 already has the GLib/GIO libraries
  # gdbus links against; its own dbus-send can't encode Notify's a{sv}
  # argument.
  #
  # Staged under usr/libexec/claude-code/, not usr/bin/: the wrappers
  # prepend $SNAP/usr/bin to PATH (for wl-copy/wl-paste), and a gdbus
  # there would shadow the host's for everything the app and Claude Code
  # run. enable-patchelf points it at core26's libraries, as for
  # wl-clipboard below.
  # ============================================================
  gdbus:
    plugin: nil
    stage-packages:
      - libglib2.0-bin
    organize:
      usr/bin/gdbus: usr/libexec/claude-code/gdbus
    stage:
      - usr/libexec/claude-code/gdbus
    build-attributes:
      - enable-patchelf

  # ============================================================
  # Configuration — wrapper scripts, bash completion
  # ============================================================
  claude-code-configuration:
    after:
      - claude-code-binary
      - claude-desktop
    plugin: nil
    source: snap/local
    override-build: |
      install -Dm755 "$CRAFT_PART_SRC"/claude.wrapper \
        "$CRAFT_PART_INSTALL"/bin/claude.wrapper
      install -Dm644 "$CRAFT_PART_SRC"/claude-onexec.sh \
        "$CRAFT_PART_INSTALL"/bin/claude-onexec.sh
      install -Dm644 "$CRAFT_PART_SRC"/claude.completion \
        "$CRAFT_PART_INSTALL"/usr/share/bash-completion/completions/claude-code.completion
      install -Dm644 "$CRAFT_PART_SRC"/claude.completion \
        "$CRAFT_PART_INSTALL"/usr/share/bash-completion/completions/claude.completion
      install -Dm644 "$CRAFT_PART_SRC"/claude-LICENSE.md \
        "$CRAFT_PART_INSTALL"/usr/share/doc/claude-code/LICENSE.md
      install -Dm755 "$CRAFT_PART_SRC"/claude-desktop.wrapper \
        "$CRAFT_PART_INSTALL"/bin/claude-desktop.wrapper
      install -Dm644 "$CRAFT_PART_SRC"/claude-desktop-cowork-check.sh \
        "$CRAFT_PART_INSTALL"/bin/claude-desktop-cowork-check.sh
