name: Build

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
    paths:
      - 'snap/snapcraft.yaml'
      - 'snap/local/**'
      - 'snap/gui/**'
      - '.image-garden.mk'
      - 'spread.yaml'
      - 'tests/**'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'snap/snapcraft.yaml'
      - 'snap/local/**'
      - 'snap/gui/**'
      - '.image-garden.mk'
      - 'spread.yaml'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      skip-spread-tests:
        type: boolean
        description: "Skip integration tests (spread) and only build the snap."
        default: false
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Publishing to the Snap Store is handled by Launchpad's snap recipe
  # integration (https://snapcraft.io/claude-code/builds), not by this
  # workflow — this only builds the snap for both architectures and runs
  # the spread integration tests against it.
  snap-build-test:
    uses: ./.github/workflows/tasteful-crafts.yml
    with:
      skip-spread-tests: ${{ inputs.skip-spread-tests || false }}
      spread-tasks: "tests/smoke/..."
